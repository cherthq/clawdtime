<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClawdTime · Prepared walkthrough</title>
<style>body{margin:0;background:#101722;color:#e5edf8;font:17px/1.5 system-ui}main{max-width:1280px;margin:auto;padding:20px}h1{font-size:24px}button{font:inherit;padding:10px 18px;border-radius:8px;cursor:pointer}#stop{background:#a62626;color:white}img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#0b111a}#state{min-height:2em}</style>
<main><h1>Prepared walkthrough</h1><p>Only the prepared app windows are shared locally. No computer control or phone call.</p>
<button id="start" disabled>Start local preview</button> <button id="stop">Stop sharing and narration</button>
<p id="state" role="status">Checking local access…</p><img id="view" alt="Prepared app scene" hidden></main>
<script>
'use strict';
const start=document.getElementById('start'),stop=document.getElementById('stop'),state=document.getElementById('state'),view=document.getElementById('view');
let audio,ws,epoch=0,ended=false,started=false,imageURL=null,generation=0,lastFrameAt=0,lastSourceAt=0;
const playing=new Set();
async function post(path,body={}){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store',signal:AbortSignal.timeout(2000)});if(!response.ok)throw Error('Local operation refused');return response.json();}
function blank(){generation++;view.hidden=true;view.removeAttribute('src');if(imageURL){URL.revokeObjectURL(imageURL);imageURL=null;}}
function clear(){for(const item of playing){item.onended=null;try{item.stop();}catch{}}playing.clear();}
async function halt(message='Sharing and narration stopped.'){if(ended)return;ended=true;start.disabled=true;blank();clear();state.textContent=message;ws?.close();const closing=audio?.close();try{await post('/local/stop');}catch{state.textContent='Stopped locally. Cleanup requires inspection.';}await closing;}
stop.onclick=()=>halt();
start.onclick=async()=>{if(started||ended)return;started=true;start.disabled=true;const startGeneration=generation;
const current=()=>!ended&&generation===startGeneration;
try{audio=new AudioContext({sampleRate:16000});await audio.resume();if(!current()){await audio.close();return;}if(audio.state!=='running')throw Error('Audio unavailable');
ws=new WebSocket(location.origin.replace('http:','ws:')+'/audio');
ws.onmessage=event=>{const value=JSON.parse(event.data);if(value.kind==='clear'){epoch=value.epoch;clear();return;}if(value.kind!=='audio'||ended||value.epoch!==epoch)return;
if(audio.state!=='running'){void halt();return;}const raw=atob(value.pcm),pcm=new DataView(new ArrayBuffer(raw.length));for(let i=0;i<raw.length;i++)pcm.setUint8(i,raw.charCodeAt(i));
const buffer=audio.createBuffer(1,raw.length/2,16000),samples=buffer.getChannelData(0);for(let i=0;i<samples.length;i++)samples[i]=pcm.getInt16(i*2,true)/32768;
const item=audio.createBufferSource();item.buffer=buffer;item.connect(audio.destination);playing.add(item);const admittedEpoch=epoch;
item.onended=()=>{playing.delete(item);if(!ended&&epoch===admittedEpoch&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({kind:'played',id:value.id}));};item.start();};
ws.onclose=()=>{if(!ended)void halt();};await new Promise((resolve,reject)=>{ws.onopen=resolve;ws.onerror=reject;});if(!current()){ws.close();return;}await post('/local/start');if(!current()){ws.close();return;}state.textContent='Ready for the prepared walkthrough.';void frames();
}catch{state.textContent='Local preview unavailable.';await halt();}};
const watchdog=setInterval(()=>{if(!view.hidden&&(performance.now()-lastFrameAt>1500||Date.now()-lastSourceAt>=2000))blank();},100);
async function frames(){let deadline=performance.now();while(!ended){const current=generation;let next=null;try{
const response=await fetch('/frame',{cache:'no-store',signal:AbortSignal.timeout(1000)});
if(!response.ok){blank();await new Promise(r=>setTimeout(r,100));continue;}
const sourceAt=Number(response.headers.get('X-Captured-At-Ms'));
if(!Number.isFinite(sourceAt)||sourceAt>Date.now()||Date.now()-sourceAt>=2000)throw Error('Stale frame');
const blob=await response.blob();if(ended||current!==generation)continue;
next=URL.createObjectURL(blob);const decoded=new Image();decoded.src=next;
await Promise.race([decoded.decode(),new Promise((_,reject)=>setTimeout(()=>reject(Error('Decode timeout')),1000))]);
if(ended||current!==generation||Date.now()-sourceAt>=2000){URL.revokeObjectURL(next);next=null;continue;}
const previous=imageURL;imageURL=next;next=null;view.src=imageURL;view.hidden=false;lastFrameAt=performance.now();lastSourceAt=sourceAt;
if(previous)URL.revokeObjectURL(previous);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));if(!ended&&current===generation)await post('/preview/paint',{frameToken:response.headers.get('X-Frame-Token')});
}catch{if(next)URL.revokeObjectURL(next);blank();}finally{deadline=Math.max(deadline+1000/15,performance.now());await new Promise(r=>setTimeout(r,Math.max(0,deadline-performance.now())));}}}

const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);
async function monitor(){while(!ended){try{const response=await fetch('/preview/status',{cache:'no-store',signal:AbortSignal.timeout(800)});if(!response.ok)throw Error('Status unavailable');const value=await response.json();if(ended)return;if(value.state==='stopped'||value.state==='unknown'){const failed=value.diagnostics?.runtime?.failure||value.diagnostics?.narrator?.failure;await halt(failed?'Walkthrough stopped. Narration could not complete.':'Sharing and narration stopped.');return;}}catch{if(!ended)await halt('Local preview unavailable. Sharing stopped.');return;}await new Promise(r=>setTimeout(r,500));}}
post('/bootstrap',{token}).then(()=>{if(ended)return;start.disabled=false;state.textContent='Choose Start local preview to enable the prepared windows and speakers.';void monitor();}).catch(()=>{state.textContent='Open the private local preview link.';});
window.addEventListener('pagehide',()=>{ended=true;clearInterval(watchdog);blank();clear();ws?.close();});
</script></html>
